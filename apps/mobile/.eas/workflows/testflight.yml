name: TestFlight

on:
  push:
    branches:
      - main
    paths:
      - apps/mobile/**
      - packages/core/**
      - patches/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch: {}

concurrency:
  group: testflight

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit to TestFlight
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
